name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the engines field declares; 24 catches what the next LTS changes.
        # node:sqlite is still flagged experimental, so both versions are worth running.
        node: ['22', '24']
    name: tests (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies to install: the server runs on node: builtins only.
      - run: npm test

  data:
    runs-on: ubuntu-latest
    name: data.js matches data.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # sync-data.py also asserts unique ids and four distinct options per item.
      - run: python3 scripts/sync-data.py
      - name: fail if data.js was not regenerated from data.json
        run: git diff --exit-code -- dist/data.js
